<style>
  :root{
    --bg:#0B1220; --panel:#141B2E; --panel-2:#1B2338;
    --text:#EDEFF5; --muted:#7C8AA3;
    --amber:#E8A33D; --teal:#2DD4BF; --line:#243049;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;line-height:1.7;}
  .mono{font-family:'JetBrains Mono',monospace;}
  nav{
    display:flex;justify-content:space-between;align-items:center;
    max-width:920px;margin:0 auto;padding:24px 32px;
    border-bottom:1px solid var(--line);
  }
  nav .brand{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:15px;}
  nav .links{display:flex;gap:28px;font-size:14px;position:relative;}
  nav a{color:var(--muted);text-decoration:none;}
  nav a.active,nav a:hover{color:var(--teal);}
  .dropdown{position:relative;}
  .dropdown-menu{
    display:none;position:absolute;top:28px;left:0;
    background:var(--panel);border:1px solid var(--line);border-radius:8px;
    min-width:150px;padding:6px;z-index:10;
  }
  .dropdown:hover .dropdown-menu{display:block;}
  .dropdown-menu a{display:block;padding:8px 10px;border-radius:6px;font-size:13px;}
  .dropdown-menu a:hover{background:var(--panel-2);}
  .wrap{max-width:920px;margin:0 auto;padding:60px 32px;}
  .tag{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:2px;color:var(--teal);}
  h1{font-family:'JetBrains Mono',monospace;font-size:28px;margin:12px 0 16px;}
  p{color:var(--muted);max-width:600px;}
</style>
</head>
